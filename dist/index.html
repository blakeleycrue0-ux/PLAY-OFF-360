<title>Torre de Control</title>
<meta charset="utf-8" />
<!--
  Sin esto el navegador móvil maqueta la página a 980 px y luego la encoge:
  todo sale diminuto y ningún ajuste de CSS lo arregla. viewport-fit=cover deja
  que el globo llegue hasta el borde, y las barras del sistema se esquivan con
  env(safe-area-inset-*).
-->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#08080a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
/>

<style>
  /*
   * El mundo del juego es de noche y sólo de noche: un planeta oscuro con las
   * ciudades encendidas. No es un tema claro al que le falte el oscuro, es una
   * decisión —por eso no hay bloques de prefers-color-scheme— y por eso cada
   * color se pinta explícito, para que la página no herede el fondo de nadie.
   */
  :root {
    --void: #08080a;
    --panel: #101116;
    --panel-hi: #171922;
    --line: #23252e;
    --ink: #ffffff;
    --dim: #9ea1aa;
    --faint: #5b5e68;
    --amber: #ff9036;
    --amber-dim: rgba(255, 144, 54, 0.16);
    --green: #4ad991;
    --red: #ff5d5d;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);

    --gutter: 18px;
    --radius: 18px;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: Archivo, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    overscroll-behavior: none;
  }

  button {
    font: inherit;
    color: inherit;
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
  }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }

  .mono {
    font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* ---------------------------------------------------------------- escena */

  #stars,
  #earth,
  #globe {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #stars {
    z-index: 0;
  }

  #earth {
    z-index: 1;
    pointer-events: none;
  }

  #globe {
    z-index: 2;
    /*
     * Esto es lo que arregla el zoom. Sin touch-action:none el navegador se
     * queda el pellizco y el arrastre para hacer su propio zoom de página, y el
     * mapa responde a lo que sobra: rígido, a saltos, imposible de acercar.
     */
    touch-action: none;
  }

  /* Chapas de aeropuerto: DOM, no canvas, para que el texto quede nítido y se
     puedan tocar con el dedo sin cazar píxeles. */
  .scrim {
    position: fixed;
    left: 0;
    right: 0;
    z-index: 3;
    pointer-events: none;
  }

  .scrim.top {
    top: 0;
    height: 42%;
    background: linear-gradient(
      to bottom,
      rgba(8, 8, 10, 0.88) 0%,
      rgba(8, 8, 10, 0.55) 45%,
      rgba(8, 8, 10, 0) 100%
    );
  }

  .scrim.bottom {
    bottom: 0;
    height: 38%;
    background: linear-gradient(
      to top,
      rgba(8, 8, 10, 0.92) 0%,
      rgba(8, 8, 10, 0.62) 42%,
      rgba(8, 8, 10, 0) 100%
    );
  }

  #chips {
    position: fixed;
    inset: 0;
    z-index: 4;
    pointer-events: none;
  }

  .chip {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px 5px 7px;
    border-radius: 999px;
    background: rgba(12, 13, 17, 0.72);
    border: 1px solid rgba(255, 144, 54, 0.4);
    color: var(--amber);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    white-space: nowrap;
    backdrop-filter: blur(8px);
    pointer-events: auto;
    transition: opacity 0.18s ease;
  }

  .chip svg {
    width: 11px;
    height: 11px;
    flex: none;
  }

  .chip.is-target {
    background: var(--amber);
    border-color: var(--amber);
    color: #1a0d02;
    box-shadow: 0 6px 22px rgba(255, 144, 54, 0.45);
  }

  .chip.is-origin {
    background: rgba(255, 255, 255, 0.92);
    border-color: rgba(255, 255, 255, 0.92);
    color: #101116;
  }

  /* --------------------------------------------------------------- chrome */

  .app {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: var(--safe-top) 0 var(--safe-bottom);
    pointer-events: none;
  }

  .app > * {
    min-width: 0;
  }

  /* Barra superior ------------------------------------------------------- */

  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px var(--gutter) 0;
  }

  .iconbtn {
    width: 42px;
    height: 42px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: rgba(18, 19, 25, 0.66);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    pointer-events: auto;
    transition:
      background 0.15s ease,
      transform 0.12s ease;
  }

  .iconbtn:active {
    transform: scale(0.93);
    background: rgba(40, 42, 52, 0.8);
  }

  .iconbtn svg {
    width: 18px;
    height: 18px;
  }

  .topbar .spacer {
    flex: 1;
  }

  .live {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 42px;
    padding: 0 14px;
    border-radius: 999px;
    background: rgba(18, 19, 25, 0.66);
    border: 1px solid var(--line);
    backdrop-filter: blur(10px);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .live b {
    color: var(--ink);
    font-weight: 600;
  }

  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 10px var(--green);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    50% {
      opacity: 0.35;
    }
  }

  /* Héroe ---------------------------------------------------------------- */

  .hero {
    align-self: start;
    padding: 20px var(--gutter) 0;
    max-width: 520px;
  }

  .greeting {
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--dim);
  }

  .destination {
    margin: 2px 0 0;
    font-size: clamp(38px, 12vw, 62px);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 0.95;
    text-wrap: balance;
    text-shadow: 0 6px 34px rgba(0, 0, 0, 0.7);
  }

  .subline {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--dim);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: rgba(16, 17, 22, 0.62);
    backdrop-filter: blur(8px);
    font-size: 11px;
    letter-spacing: 0.04em;
  }

  .tag.amber {
    color: var(--amber);
    border-color: rgba(255, 144, 54, 0.35);
    background: var(--amber-dim);
  }

  /* Pie ------------------------------------------------------------------ */

  .foot {
    align-self: end;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 0 0 14px;
  }

  /* Regla de progreso ---------------------------------------------------- */

  .scrub {
    padding: 0 var(--gutter);
  }

  .scrub-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .scrub-head b {
    color: var(--ink);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    text-transform: none;
  }

  .ruler {
    position: relative;
    height: 30px;
    margin-top: 6px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);
  }

  .ticks {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
  }

  .ticks i {
    width: 1.2px;
    height: 8px;
    border-radius: 1px;
    background: rgba(255, 255, 255, 0.22);
  }

  .ticks i.tall {
    height: 15px;
    background: rgba(255, 255, 255, 0.4);
  }

  .ticks i.done {
    background: var(--amber);
  }

  .ticks i.tall.done {
    background: var(--amber);
  }

  .cursor {
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 2px;
    height: 24px;
    border-radius: 2px;
    background: var(--ink);
    box-shadow: 0 0 14px rgba(255, 255, 255, 0.7);
    transform: translateX(-50%);
    transition: left 0.4s linear;
  }

  .cursor::before {
    content: '';
    position: absolute;
    top: -5px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink);
    transform: translateX(-50%);
  }

  /* Carrusel ------------------------------------------------------------- */

  .rail {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 2px var(--gutter) 4px;
    scrollbar-width: none;
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
  }

  .rail::-webkit-scrollbar {
    display: none;
  }

  .card {
    flex: 0 0 auto;
    width: 210px;
    scroll-snap-align: start;
    text-align: left;
    padding: 12px 13px;
    border-radius: var(--radius);
    background: rgba(16, 17, 22, 0.78);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
    transition:
      transform 0.16s ease,
      background 0.2s ease;
  }

  .card:active {
    transform: scale(0.97);
  }

  .card.on {
    background: var(--ink);
    border-color: var(--ink);
    color: #0b0c10;
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--faint);
  }

  .card.on .card-top {
    color: rgba(11, 12, 16, 0.55);
  }

  .card-city {
    margin-top: 7px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-sub {
    margin-top: 2px;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card.on .card-sub {
    color: rgba(11, 12, 16, 0.62);
  }

  .bar {
    margin-top: 10px;
    height: 3px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    overflow: hidden;
  }

  .card.on .bar {
    background: rgba(11, 12, 16, 0.14);
  }

  .bar span {
    display: block;
    height: 100%;
    border-radius: 2px;
    background: var(--amber);
  }

  /* Botón principal ------------------------------------------------------ */

  .cta {
    margin: 0 var(--gutter);
    height: 54px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    border-radius: 999px;
    background: var(--ink);
    color: #0b0c10;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.01em;
    pointer-events: auto;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.55);
    transition: transform 0.14s ease;
  }

  .cta:active {
    transform: scale(0.975);
  }

  .cta svg {
    width: 17px;
    height: 17px;
  }
</style>

<style>
  /* ------------------------------------------------------- panel de datos */

  .sheet {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 7;
    max-height: 88%;
    display: flex;
    flex-direction: column;
    background: rgba(10, 11, 15, 0.94);
    border-top: 1px solid var(--line);
    border-radius: 26px 26px 0 0;
    backdrop-filter: blur(24px);
    transform: translateY(101%);
    transition: transform 0.36s cubic-bezier(0.32, 0.72, 0, 1);
    box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.6);
  }

  .sheet.open {
    transform: translateY(0);
  }

  .grip {
    flex: none;
    padding: 10px 0 4px;
    display: grid;
    place-items: center;
    cursor: grab;
    touch-action: none;
  }

  .grip i {
    width: 40px;
    height: 4px;
    border-radius: 2px;
    background: #353843;
  }

  .sheet-head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px var(--gutter) 10px;
  }

  .sheet-head h2 {
    flex: 1;
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .tabs {
    flex: none;
    display: flex;
    gap: 4px;
    padding: 0 var(--gutter) 12px;
  }

  .tab {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 12px;
    font-weight: 600;
    color: var(--dim);
    white-space: nowrap;
  }

  .tab[aria-selected='true'] {
    background: var(--ink);
    border-color: var(--ink);
    color: #0b0c10;
  }

  .sheet-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 0 var(--gutter) calc(22px + var(--safe-bottom));
    overscroll-behavior: contain;
  }

  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 8px;
  }

  .kpi {
    padding: 13px 14px;
    border-radius: 15px;
    background: var(--panel);
    border: 1px solid var(--line);
  }

  .kpi dt {
    margin: 0;
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .kpi dd {
    margin: 5px 0 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.03em;
  }

  .kpi dd small {
    font-size: 12px;
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 0;
  }

  .note {
    margin: 14px 0 0;
    padding: 12px 14px;
    border-radius: 14px;
    border: 1px solid rgba(255, 144, 54, 0.28);
    background: var(--amber-dim);
    font-size: 12px;
    line-height: 1.55;
    color: #e7cfb4;
  }

  .note b {
    color: var(--amber);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 8px 6px;
    text-align: right;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    background: rgba(10, 11, 15, 0.97);
    border-bottom: 1px solid var(--line);
  }

  thead th:first-child {
    text-align: left;
  }

  tbody td {
    padding: 9px 6px;
    text-align: right;
    border-bottom: 1px solid rgba(35, 37, 46, 0.6);
    white-space: nowrap;
  }

  tbody td:first-child {
    text-align: left;
    white-space: normal;
  }

  tbody tr:last-child td {
    border-bottom: 0;
  }

  .who {
    font-weight: 600;
  }

  .who span {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .pos {
    color: var(--green);
  }

  .neg {
    color: var(--red);
  }

  .scroller {
    overflow-x: auto;
  }

  .ledger {
    display: grid;
    gap: 1px;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 15px;
    overflow: hidden;
  }

  .ledger div {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    background: var(--panel);
    font-size: 13px;
  }

  .ledger dt {
    margin: 0;
    color: var(--dim);
    font-size: 12px;
  }

  .ledger dd {
    margin: 0;
    font-weight: 600;
  }

  .veil {
    position: fixed;
    inset: 0;
    z-index: 6;
    background: rgba(4, 4, 6, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .veil.on {
    opacity: 1;
    pointer-events: auto;
  }

  /* ------------------------------------------------------------ escritorio */

  @media (min-width: 900px) {
    :root {
      --gutter: 26px;
    }

    .app {
      grid-template-rows: auto 1fr;
      grid-template-columns: minmax(340px, 30%) 1fr;
    }

    .topbar {
      grid-column: 1 / -1;
      padding-top: 18px;
    }

    .hero {
      grid-column: 1;
      align-self: center;
      padding-top: 0;
    }

    .foot {
      grid-column: 1;
      align-self: end;
      padding-bottom: 26px;
    }

    .rail {
      flex-wrap: nowrap;
    }

    .card {
      width: 190px;
    }

    .sheet {
      left: auto;
      right: 0;
      top: 0;
      bottom: 0;
      width: min(520px, 46vw);
      max-height: none;
      border-radius: 24px 0 0 24px;
      border-top: 0;
      border-left: 1px solid var(--line);
      transform: translateX(102%);
    }

    .sheet.open {
      transform: translateX(0);
    }

    .grip {
      display: none;
    }

    .sheet-head {
      padding-top: 22px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>

<canvas id="stars" aria-hidden="true"></canvas>
<canvas id="earth" aria-hidden="true"></canvas>
<canvas
  id="globe"
  role="img"
  aria-label="Globo terráqueo con la red aérea del mundo en juego"
></canvas>
<div class="scrim top" aria-hidden="true"></div>
<div class="scrim bottom" aria-hidden="true"></div>
<div id="chips"></div>

<div class="app">
  <header class="topbar">
    <button
      class="iconbtn"
      id="recenter"
      type="button"
      title="Centrar en el vuelo"
      aria-label="Centrar el globo en el vuelo seleccionado"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <circle cx="12" cy="12" r="8" />
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
        <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none" />
      </svg>
    </button>
    <div class="live">
      <i class="dot"></i><span><b id="airborne">0</b> en vuelo</span>
    </div>
    <span class="spacer"></span>
    <button
      class="iconbtn"
      id="shuffle"
      type="button"
      title="Otro vuelo"
      aria-label="Saltar a otro vuelo"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17 3l4 4-4 4M21 7H3M7 21l-4-4 4-4M3 17h18" />
      </svg>
    </button>
    <button
      class="iconbtn"
      id="open-ops"
      type="button"
      title="Centro de operaciones"
      aria-label="Abrir el centro de operaciones"
    >
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
      >
        <path d="M4 18V9M10 18V4M16 18v-6M22 18H2" />
      </svg>
    </button>
  </header>

  <section class="hero">
    <p class="greeting" id="greeting">Buenas noches</p>
    <h1 class="destination" id="dest-city">—</h1>
    <div class="subline" id="subline"></div>
  </section>

  <footer class="foot">
    <div class="scrub">
      <div class="scrub-head">
        <span id="scrub-left">—</span>
        <b id="scrub-mid">—</b>
        <span id="scrub-right">—</span>
      </div>
      <div class="ruler">
        <div class="ticks" id="ticks"></div>
        <div class="cursor" id="cursor"></div>
      </div>
    </div>

    <div class="rail" id="rail" role="listbox" aria-label="Vuelos"></div>

    <button class="cta" id="cta" type="button">
      <svg
        viewBox="0 0 24 24"
        fill="none"

<script>
  (function () {
    'use strict';

    var DATA = JSON.parse(document.getElementById('snapshot').textContent);
    // La fotografía va como fichero aparte, no incrustada: así el navegador la
    // cachea entre visitas y el HTML no engorda 400 KB en base64.
    var EARTH_TEXTURE = 'earth-bmng-2048.jpg';
    var d3 = window.d3;
    var RAD = Math.PI / 180;
    var DEG = 180 / Math.PI;
    var MS_DAY = 86400000;

    /* ------------------------------------------------------------ índices */

    var byIata = {};
    DATA.airports.forEach(function (a) {
      byIata[a.iata] = a;
    });

    var airlineByName = {};
    DATA.airlines.forEach(function (a) {
      airlineByName[a.name] = a;
    });

    /**
     * La instantánea guarda el minuto del día en que sale y llega cada vuelo,
     * no el instante en que se simuló. Así el día se reproduce sobre la fecha de
     * hoy: lo que se ve a las 19:20 de cualquier día es lo que de verdad opera a
     * esa hora, y la vista previa sigue viva mañana.
     */
    function dayBase(now) {
      return Math.floor(now / MS_DAY) * MS_DAY;
    }

    function schedule(f, now) {
      var span = f.arrMs - f.depMs;
      var dep = dayBase(now) + f.depMs;
      // La plantilla se repite cada día, así que un vuelo que ya aterrizó no es
      // un vuelo muerto: su próxima ocurrencia es la de mañana. Sin esto la
      // página se quedaba en blanco desde el último aterrizaje hasta el primer
      // despegue del día siguiente.
      if (dep + span <= now) dep += MS_DAY;
      return {
        dep: dep,
        arr: dep + span,
        span: span,
        t: span <= 0 ? 1 : Math.max(0, Math.min(1, (now - dep) / span)),
        airborne: now >= dep && now < dep + span,
      };
    }

    /* ------------------------------------------------- geometría esférica */

    /**
     * Interpolación sobre el círculo máximo. Un avión no viaja en línea recta
     * sobre el mapa: viaja por el arco más corto de la esfera, y en un globo la
     * diferencia se ve a simple vista.
     */
    function slerp(f, t) {
      var p1 = f.oLat * RAD,
        l1 = f.oLon * RAD,
        p2 = f.dLat * RAD,
        l2 = f.dLon * RAD;
      var dp = p2 - p1,
        dl = l2 - l1;
      var h =
        Math.sin(dp / 2) * Math.sin(dp / 2) +
        Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) * Math.sin(dl / 2);
      var d = 2 * Math.asin(Math.min(1, Math.sqrt(h)));
      if (d < 1e-9) return [f.oLon, f.oLat];

      var a = Math.sin((1 - t) * d) / Math.sin(d);
      var b = Math.sin(t * d) / Math.sin(d);
      var x = a * Math.cos(p1) * Math.cos(l1) + b * Math.cos(p2) * Math.cos(l2);
      var y = a * Math.cos(p1) * Math.sin(l1) + b * Math.cos(p2) * Math.sin(l2);
      var z = a * Math.sin(p1) + b * Math.sin(p2);
      return [Math.atan2(y, x) * DEG, Math.atan2(z, Math.sqrt(x * x + y * y)) * DEG];
    }

    var arcCache = {};
    function arcPoints(f) {
      if (arcCache[f.id] === undefined) {
        var pts = [];
        for (var i = 0; i <= 72; i++) pts.push(slerp(f, i / 72));
        arcCache[f.id] = pts;
      }
      return arcCache[f.id];
    }

    /* --------------------------------------------------------- el planeta */

    var globe = document.getElementById('globe');
    var ctx = globe.getContext('2d');
    var starsCanvas = document.getElementById('stars');
    var world = document.createElement('canvas');
    var wctx = world.getContext('2d');

    var projection = d3.geoOrthographic().clipAngle(90).precision(0.35);
    var draw = d3.geoPath(projection, wctx);
    var drawLive = d3.geoPath(projection, ctx);
    var graticule = d3.geoGraticule().step([15, 15])();

    var view = { w: 0, h: 0, dpr: 1 };
    var cam = { lon: 6, lat: 46, zoom: 1 };
    var baseScale = 200;
    // Dónde cae el centro del planeta en pantalla. En móvil, algo por encima
    // del centro para dejar respirar al carrusel; en pantalla ancha, a la
    // derecha, porque la columna de texto ocupa la izquierda.
    var focus = { x: 0, y: 0 };

    // Sin esto la tierra se pinta en cada fotograma aunque nadie haya movido el
    // globo. Lo estático se cachea y sólo se rehace cuando cambia la cámara.
    var worldKey = '';

    function clampCam() {
      cam.lat = Math.max(-84, Math.min(84, cam.lat));
      cam.lon = ((((cam.lon + 180) % 360) + 360) % 360) - 180;
      cam.zoom = Math.max(1, Math.min(8, cam.zoom));
    }

    function applyCam() {
      clampCam();
      projection
        .scale(baseScale * cam.zoom)
        .translate([focus.x, focus.y])
        .rotate([-cam.lon, -cam.lat]);
    }

    /** Mueve la cámara como si el dedo arrastrase el punto que tiene debajo. */
    function dragBy(dx, dy) {
      var k = DEG / projection.scale();
      var shrink = Math.max(0.25, Math.cos(cam.lat * RAD));
      cam.lon -= (dx * k) / shrink;
      cam.lat += dy * k;
      applyCam();
    }

    /** Deja el punto geográfico dado justo bajo el píxel pedido. */
    function pinGeoTo(geo, px, py) {
      for (var i = 0; i < 4; i++) {
        var p = projection(geo);
        if (!p) return;
        var dx = px - p[0];
        var dy = py - p[1];
        if (Math.abs(dx) < 0.4 && Math.abs(dy) < 0.4) return;
        dragBy(dx, dy);
      }
    }

    function visible(lon, lat) {
      return d3.geoDistance([lon, lat], [cam.lon, cam.lat]) < Math.PI / 2 - 0.01;
    }

    /* ------------------------------------------------- la Tierra de verdad */

    /**
     * El planeta se dibuja con la fotografía de la NASA envuelta sobre la
     * esfera, no con un relleno de color.
     *
     * Va en WebGL y no en el lienzo 2D por una razón concreta: envolver una
     * imagen equirectangular sobre una ortográfica exige, para cada píxel,
     * deshacer la rotación y convertir a longitud y latitud. En JavaScript eso
     * es un bucle de cien mil iteraciones por fotograma y el arrastre se
     * arrastra; en la tarjeta gráfica es lo que sabe hacer.
     *
     * Si no hay WebGL —o si la imagen no llega— la página no se queda en negro:
     * `paintVectorGlobe()` dibuja el planeta como antes, en vectores.
     */
    var earthCanvas = document.getElementById('earth');
    var earth = null;

    var VERTEX_SHADER = [
      'attribute vec2 aPos;',
      'void main() { gl_Position = vec4(aPos, 0.0, 1.0); }',
    ].join('\n');

    var FRAGMENT_SHADER = [
      'precision highp float;',
      'uniform vec2 uCentre;', // en píxeles de lienzo, con la Y hacia arriba
      'uniform float uRadius;',
      'uniform vec2 uRot;', // longitud y latitud del centro, en radianes
      'uniform vec3 uSun;', // dirección al Sol en el marco geográfico
      'uniform sampler2D uEarth;',
      'uniform float uReady;',
      '',
      'void main() {',
      '  vec2 p = (gl_FragCoord.xy - uCentre) / uRadius;',
      '  float r2 = dot(p, p);',
      '',
      // Fuera del disco sólo queda la atmósfera, que es lo que separa el
      // planeta del vacío sin dibujarle un contorno duro.
      '  if (r2 > 1.0) {',
      '    float glow = smoothstep(1.34, 1.0, sqrt(r2));',
      '    gl_FragColor = vec4(vec3(0.33, 0.52, 0.74) * glow, glow * 0.42);',
      '    return;',
      '  }',
      '',
      // Deshacer la ortográfica: el punto visible de la esfera unidad.
      '  float front = sqrt(max(0.0, 1.0 - r2));',
      '  float cosLat = cos(uRot.y);',
      '  float sinLat = sin(uRot.y);',
      '  vec3 n = vec3(',
      '    front * cosLat - p.y * sinLat,',
      '    p.x,',
      '    front * sinLat + p.y * cosLat',
      '  );',
      '',
      '  float lon = atan(n.y, n.x) + uRot.x;',
      '  float lat = asin(clamp(n.z, -1.0, 1.0));',
      '  vec2 uv = vec2(fract(lon / 6.283185307 + 0.5), 0.5 - lat / 3.141592653);',
      '',
      '  vec3 base = uReady > 0.5 ? texture2D(uEarth, uv).rgb : vec3(0.10, 0.13, 0.17);',
      '',
      // El terminador sale del reloj del mundo, no de una luz decorativa
      // colocada a ojo: el lado iluminado es el que de verdad tiene sol ahora.
      '  float ndl = dot(n, uSun);',
      '  float light = smoothstep(-0.14, 0.20, ndl);',
      '',
      // La fotografía viene de un satélite a mediodía y sale demasiado clara
      // para una interfaz negra: se baja la exposición y se le quita algo de
      // saturación. Sigue siendo la imagen real, sólo que revelada más oscura.
      '  float grey = dot(base, vec3(0.299, 0.587, 0.114));',
      '  vec3 graded = mix(vec3(grey), base, 0.78) * vec3(0.62, 0.66, 0.76);',
      '  vec3 day = graded;',
      '  vec3 night = graded * 0.13 + vec3(0.013, 0.018, 0.032);',
      '  vec3 col = mix(night, day, light);',
      '',
      // Oscurecimiento del limbo y un filo azul en el borde iluminado.
      '  float limb = sqrt(max(0.0, 1.0 - r2));',
      '  col *= mix(0.72, 1.0, pow(limb, 0.45));',
      '  col += vec3(0.20, 0.36, 0.56) * pow(1.0 - limb, 4.0) * light * 0.70;',
      '',
      '  gl_FragColor = vec4(col, 1.0);',
      '}',
    ].join('\n');

    function compile(gl, type, source) {
      var shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
        gl.deleteShader(shader);
        return null;
      }
      return shader;
    }

    function initEarth() {
      var gl = null;
      try {
        gl =
          earthCanvas.getContext('webgl', { alpha: true, antialias: false, depth: false }) ||
          earthCanvas.getContext('experimental-webgl', { alpha: true, depth: false });
      } catch (ignored) {
        gl = null;
      }
      if (!gl) return null;

      var vs = compile(gl, gl.VERTEX_SHADER, VERTEX_SHADER);
      var fs = compile(gl, gl.FRAGMENT_SHADER, FRAGMENT_SHADER);
      if (!vs || !fs) return null;

      var program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return null;
      gl.useProgram(program);

      var buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
      var aPos = gl.getAttribLocation(program, 'aPos');
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      var texture = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, texture);
      // Un píxel mientras llega la fotografía, para que no parpadee.
      gl.texImage2D(
        gl.TEXTURE_2D,
        0,
        gl.RGBA,
        1,
        1,
        0,
        gl.RGBA,
        gl.UNSIGNED_BYTE,
        new Uint8Array([26, 33, 43, 255]),
      );
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      var state = {
        gl: gl,
        texture: texture,
        ready: 0,
        u: {
          centre: gl.getUniformLocation(program, 'uCentre'),
          radius: gl.getUniformLocation(program, 'uRadius'),
          rot: gl.getUniformLocation(program, 'uRot'),
          sun: gl.getUniformLocation(program, 'uSun'),
          ready: gl.getUniformLocation(program, 'uReady'),
        },
      };

      var image = new Image();
      image.crossOrigin = 'anonymous';
      image.addEventListener('load', function () {
        // Subir la imagen puede fallar por razones que no son culpa de nadie:
        // abierta desde el disco, cada fichero cuenta como otro origen y WebGL
        // se niega. El planeta se queda con el color liso y las fronteras
        // encima, que es feo pero funciona; sin este try la página se caía.
        try {
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, 0);
          gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, image);
          state.ready = 1;
        } catch (ignored) {
          state.ready = 0;
        }
        worldKey = '';
      });
      image.src = EARTH_TEXTURE;

      return state;
    }

    /**
     * Dirección al Sol en el marco geográfico, para la hora dada.
     *
     * Declinación por la aproximación habitual del día del año y longitud
     * subsolar por la hora UTC. Se desprecia la ecuación del tiempo: como mucho
     * son dieciséis minutos, que a este tamaño no mueve el terminador ni un
     * píxel.
     */
    function sunDirection(now) {
      var date = new Date(now);
      var dayOfYear = Math.floor((now - Date.UTC(date.getUTCFullYear(), 0, 1)) / MS_DAY) + 1;
      var declination = -23.44 * RAD * Math.cos(((2 * Math.PI) / 365.24) * (dayOfYear + 10));

      var utcHours = date.getUTCHours() + date.getUTCMinutes() / 60 + date.getUTCSeconds() / 3600;
      var longitude = (12 - utcHours) * 15 * RAD;

      return [
        Math.cos(declination) * Math.cos(longitude),
        Math.cos(declination) * Math.sin(longitude),
        Math.sin(declination),
      ];
    }

    /** Cuánto sol le da a un punto: 0 noche cerrada, 1 mediodía. */
    function daylight(lon, lat, sun) {
      var la = lat * RAD;
      var lo = lon * RAD;
      var dot =
        Math.cos(la) * Math.cos(lo) * sun[0] +
        Math.cos(la) * Math.sin(lo) * sun[1] +
        Math.sin(la) * sun[2];
      return Math.max(0, Math.min(1, (dot + 0.14) / 0.34));
    }

    function paintEarth(sun) {
      if (!earth) return;
      var gl = earth.gl;
      gl.viewport(0, 0, earthCanvas.width, earthCanvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.uniform2f(earth.u.centre, focus.x * view.dpr, earthCanvas.height - focus.y * view.dpr);
      gl.uniform1f(earth.u.radius, projection.scale() * view.dpr);
      gl.uniform2f(earth.u.rot, cam.lon * RAD, cam.lat * RAD);
      gl.uniform3f(earth.u.sun, sun[0], sun[1], sun[2]);
      gl.uniform1f(earth.u.ready, earth.ready);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    /** El planeta de repuesto: sin WebGL, el mundo se dibuja como antes. */
    function paintVectorGlobe(cx, cy, r) {
      var halo = wctx.createRadialGradient(cx, cy, r * 0.97, cx, cy, r * 1.16);
      halo.addColorStop(0, 'rgba(94,142,196,0.20)');
      halo.addColorStop(1, 'rgba(94,142,196,0)');
      wctx.fillStyle = halo;
      wctx.beginPath();
      wctx.arc(cx, cy, r * 1.16, 0, 2 * Math.PI);
      wctx.fill();

      var sea = wctx.createRadialGradient(cx - r * 0.36, cy - r * 0.42, r * 0.05, cx, cy, r * 1.02);
      sea.addColorStop(0, '#1b2531');
      sea.addColorStop(0.55, '#101720');
      sea.addColorStop(1, '#05070b');
      wctx.fillStyle = sea;
      wctx.beginPath();
      wctx.arc(cx, cy, r, 0, 2 * Math.PI);
      wctx.fill();
    }

    /* ------------------------------------------------------ capa estática */

    function paintWorld(sun) {
      var cx = focus.x;
      var cy = focus.y;
      var r = projection.scale();

      wctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      wctx.clearRect(0, 0, view.w, view.h);

      // Con WebGL el planeta ya está pintado debajo, con la fotografía; aquí
      // sólo van las líneas. Sin WebGL, este lienzo dibuja también la esfera.
      if (!earth) paintVectorGlobe(cx, cy, r);

      wctx.save();
      wctx.beginPath();
      wctx.arc(cx, cy, r, 0, 2 * Math.PI);
      wctx.clip();

      // La retícula sólo tiene sentido sobre el planeta de repuesto: sobre la
      // fotografía son rayas pintadas encima de la Tierra.
      if (!earth) {
        wctx.strokeStyle = 'rgba(126,158,199,0.065)';
        wctx.lineWidth = 0.6;
        wctx.beginPath();
        draw(graticule);
        wctx.stroke();
      }

      if (!earth) {
        wctx.fillStyle = '#1b222c';
        wctx.beginPath();
        draw(DATA.map.land);
        wctx.fill();
      }

      // Sobre la fotografía las fronteras son lo único que la foto no trae, y
      // es lo que deja leer dónde acaba un país.
      wctx.strokeStyle = earth ? 'rgba(180,206,236,0.30)' : 'rgba(138,168,206,0.16)';
      wctx.lineWidth = 0.5;
      wctx.beginPath();
      draw(DATA.map.borders);
      wctx.stroke();

      // La red: todas las rutas activas del mundo, apenas insinuadas. Son el
      // fondo sobre el que destaca el vuelo elegido, no el protagonista.
      wctx.strokeStyle = earth ? 'rgba(255,170,96,0.16)' : 'rgba(255,144,54,0.085)';
      wctx.lineWidth = 0.55;
      wctx.beginPath();
      DATA.routes.forEach(function (route) {
        if (!visible(route.oLon, route.oLat) && !visible(route.dLon, route.dLat)) return;
        draw({
          type: 'LineString',
          coordinates: [
            [route.oLon, route.oLat],
            [route.dLon, route.dLat],
          ],
        });
      });
      wctx.stroke();

      paintCityLights(sun);
      wctx.restore();
    }

    /**
     * Los aeropuertos son las luces de las ciudades. El tamaño sale del peso de
     * mercado, así que el planeta se ilumina donde de verdad hay tráfico.
     */
    function paintCityLights(sun) {
      var zoomBoost = 0.72 + cam.zoom * 0.14;
      // De lejos sólo se ven las capitales; al acercarse van encendiéndose las
      // demás. Dibujarlas todas desde el principio convierte Europa en una
      // mancha naranja en la que no se distingue nada.
      var floor = cam.zoom < 1.5 ? 4 : cam.zoom < 2.4 ? 3 : cam.zoom < 3.6 ? 2 : 0;

      DATA.airports.forEach(function (a) {
        if (a.size < floor) return;
        if (!visible(a.lon, a.lat)) return;
        var p = projection([a.lon, a.lat]);
        if (!p) return;
        var r = (0.5 + Math.sqrt(a.weight) / 17) * zoomBoost;

        // Una luz de ciudad se ve de noche. De día el aeropuerto sigue ahí,
        // pero apagado, como en la fotografía que tiene debajo.
        var night = 1 - daylight(a.lon, a.lat, sun);
        var glow = 0.05 + night * 0.16;
        var core = 0.42 + night * 0.5;

        wctx.fillStyle = 'rgba(255,160,80,' + glow.toFixed(3) + ')';
        wctx.beginPath();
        wctx.arc(p[0], p[1], r * 3.4, 0, 2 * Math.PI);
        wctx.fill();

        wctx.fillStyle =
          a.size >= 4
            ? 'rgba(255,220,176,' + Math.min(1, core + 0.2).toFixed(3) + ')'
            : 'rgba(255,172,102,' + core.toFixed(3) + ')';
        wctx.beginPath();
        wctx.arc(p[0], p[1], r, 0, 2 * Math.PI);
        wctx.fill();
      });
    }

    /* ------------------------------------------------------ capa animada */

    function planeAt(f, t) {
      var here = slerp(f, t);
      var ahead = slerp(f, Math.min(1, t + 0.004));
      if (!visible(here[0], here[1])) return null;
      var a = projection(here);
      var b = projection(ahead);
      if (!a || !b) return null;
      return { x: a[0], y: a[1], angle: Math.atan2(b[1] - a[1], b[0] - a[0]), geo: here };
    }

    function drawPlane(x, y, angle, size, fill, glow) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      if (glow) {
        ctx.shadowColor = glow;
        ctx.shadowBlur = 14;
      }
      ctx.beginPath();
      ctx.moveTo(size, 0);
      ctx.lineTo(-size * 0.75, size * 0.62);
      ctx.lineTo(-size * 0.4, 0);
      ctx.lineTo(-size * 0.75, -size * 0.62);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();
      // Un filo oscuro alrededor: sobre el mar se leen solos, pero sobre el
      // verde de Europa o la arena del Sáhara se perdían.
      ctx.shadowBlur = 0;
      ctx.lineWidth = 0.7;
      ctx.strokeStyle = 'rgba(8,10,14,0.55)';
      ctx.stroke();
      ctx.restore();
    }

    function paintLive(now, flying, selected) {
      ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      ctx.clearRect(0, 0, view.w, view.h);
      ctx.drawImage(world, 0, 0, view.w, view.h);

      ctx.save();
      ctx.beginPath();
      ctx.arc(focus.x, focus.y, projection.scale(), 0, 2 * Math.PI);
      ctx.clip();

      if (selected) {
        var s = schedule(selected, now);
        var pts = arcPoints(selected);
        var cut = Math.max(1, Math.round(s.t * (pts.length - 1)));

        ctx.lineWidth = 1;
        ctx.setLineDash([3, 4]);
        ctx.strokeStyle = 'rgba(255,255,255,0.32)';
        ctx.beginPath();
        drawLive({ type: 'LineString', coordinates: pts.slice(cut) });
        ctx.stroke();

        ctx.setLineDash([]);
        ctx.lineWidth = 1.8;
        ctx.strokeStyle = '#ffffff';
        ctx.shadowColor = 'rgba(255,255,255,0.55)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        drawLive({ type: 'LineString', coordinates: pts.slice(0, cut + 1) });
        ctx.stroke();
        ctx.shadowBlur = 0;

        [
          [selected.oLon, selected.oLat],
          [selected.dLon, selected.dLat],
        ].forEach(function (geo, index) {
          if (!visible(geo[0], geo[1])) return;
          var p = projection(geo);
          if (!p) return;
          ctx.fillStyle = index === 0 ? '#ffffff' : '#ff9036';
          ctx.shadowColor = index === 0 ? 'rgba(255,255,255,0.8)' : 'rgba(255,144,54,0.9)';
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(p[0], p[1], 3.4, 0, 2 * Math.PI);
          ctx.fill();
          ctx.shadowBlur = 0;
        });
      }

      flying.forEach(function (item) {
        if (selected && item.flight.id === selected.id) return;
        var pos = planeAt(item.flight, item.state.t);
        if (pos) drawPlane(pos.x, pos.y, pos.angle, 3.4, 'rgba(255,167,92,0.82)', null);
      });

      if (selected) {
        var st = schedule(selected, now);
        var pos = planeAt(selected, st.t);
        if (pos) drawPlane(pos.x, pos.y, pos.angle, 7, '#ffffff', 'rgba(255,255,255,0.9)');
      }

      ctx.restore();
    }

    /* ------------------------------------------------------------ estrellas */

    /**
     * Generador con semilla: el cielo tiene que salir igual en cada carga y en
     * cada dispositivo. Un Math.random() aquí haría que la misma captura de
     * pantalla no se pudiera repetir nunca.
     */
    function seeded(seed) {
      var s = seed >>> 0;
      return function () {
        s = (s + 0x6d2b79f5) >>> 0;
        var t = s;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function paintStars() {
      var sctx = starsCanvas.getContext('2d');
      var rand = seeded(20260920);
      sctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
      sctx.clearRect(0, 0, view.w, view.h);
      sctx.fillStyle = '#08080a';
      sctx.fillRect(0, 0, view.w, view.h);

      var count = Math.round((view.w * view.h) / 5200);
      for (var i = 0; i < count; i++) {
        var x = rand() * view.w;
        var y = rand() * view.h;
        var r = rand();
        sctx.fillStyle = 'rgba(206,219,238,' + (0.12 + r * 0.55).toFixed(3) + ')';
        sctx.beginPath();
        sctx.arc(x, y, 0.3 + r * 1.1, 0, 2 * Math.PI);
        sctx.fill();
      }
    }

    /* ------------------------------------------------------------- formato */

    function pad(n) {
      return (n < 10 ? '0' : '') + n;
    }

    function hhmm(ms) {
      var d = new Date(ms);
      return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes());
    }

    function duration(ms) {
      var total = Math.max(0, Math.round(ms / 60000));
      var h = Math.floor(total / 60);
      var m = total % 60;
      return h > 0 ? h + 'h ' + pad(m) + 'm' : m + 'm';
    }

    function thousands(n) {
      return Math.round(n).toLocaleString('es-ES');
    }

    function euros(n) {
      var abs = Math.abs(n);
      if (abs >= 1e6) return (n / 1e6).toFixed(1).replace('.', ',') + ' M€';
      if (abs >= 1e3) return Math.round(n / 1e3) + ' k€';
      return Math.round(n) + ' €';
    }

    function cityOf(code) {
      var a = byIata[code];
      return a ? a.city || a.name : code;
    }

    /* -------------------------------------------------------------- estado */

    var selectedId = null;
    var listed = [];
    var RAIL_SIZE = 20;
    var followSelection = true;

    function flightsNow(now) {
      var flying = [];
      DATA.flights.forEach(function (f) {
        var state = schedule(f, now);
        if (state.airborne) flying.push({ flight: f, state: state });
      });
      flying.sort(function (a, b) {
        return a.state.dep - b.state.dep;
      });
      return flying;
    }

    /** Lo próximo que despega, para cuando el mundo duerme y no hay nadie en el aire. */
    function upcoming(now) {
      var next = DATA.flights.map(function (f) {
        return { flight: f, state: schedule(f, now) };
      });
      next.sort(function (a, b) {
        return a.state.dep - b.state.dep;
      });
      return next.slice(0, 12);
    }

    function findFlight(id) {
      for (var i = 0; i < DATA.flights.length; i++) {
        if (DATA.flights[i].id === id) return DATA.flights[i];
      }
      return null;
    }

    /* --------------------------------------------------------- interacción */

    var pointers = {};
    var lastPinch = 0;
    var drag = null;
    var velocity = { x: 0, y: 0 };
    var spin = null;
    var lastTap = 0;
    var idleSince = Date.now();

    function pointerList() {
      return Object.keys(pointers).map(function (k) {
        return pointers[k];
      });
    }

    globe.addEventListener(
      'pointerdown',
      function (e) {
        // La captura es una comodidad, no un requisito: si el navegador la
        // rechaza (el puntero ya se soltó, un evento sintético), el gesto tiene
        // que seguir funcionando igual en vez de abortar aquí.
        try {
          globe.setPointerCapture(e.pointerId);
        } catch (ignored) {
          /* sin captura */
        }
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        spin = null;
        velocity.x = 0;
        velocity.y = 0;
        idleSince = Date.now();

        var list = pointerList();
        if (list.length === 2) {
          lastPinch = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
          drag = null;
        } else {
          drag = { x: e.clientX, y: e.clientY, at: performance.now(), moved: 0 };
        }
      },
      { passive: true },
    );

    globe.addEventListener(
      'pointermove',
      function (e) {
        if (pointers[e.pointerId] === undefined) return;
        pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
        var list = pointerList();

        if (list.length >= 2) {
          // Pellizco: además de acercar, mantiene bajo los dedos el trozo de
          // planeta que estaban tocando. Sin eso el zoom "salta" y es justo lo
          // que hacía que el mapa pareciera rígido.
          var dist = Math.hypot(list[0].x - list[1].x, list[0].y - list[1].y);
          if (lastPinch > 0) {
            var mx = (list[0].x + list[1].x) / 2;
            var my = (list[0].y + list[1].y) / 2;
            zoomAround(dist / lastPinch, mx, my);
          }
          lastPinch = dist;
          followSelection = false;
          requestPaint(true);
          return;
        }

        if (!drag) return;
        var dx = e.clientX - drag.x;
        var dy = e.clientY - drag.y;
        var dt = Math.max(1, performance.now() - drag.at);
        drag.moved += Math.abs(dx) + Math.abs(dy);
        velocity.x = dx / dt;
        velocity.y = dy / dt;
        drag.x = e.clientX;
        drag.y = e.clientY;
        drag.at = performance.now();
        followSelection = false;
        dragBy(dx, dy);
        requestPaint(true);
      },
      { passive: true },
    );

    function endPointer(e) {
      var wasDrag = drag;
      delete pointers[e.pointerId];
      var list = pointerList();
      if (list.length < 2) lastPinch = 0;
      if (list.length === 1) {
        drag = { x: list[0].x, y: list[0].y, at: performance.now(), moved: 999 };
        return;
      }
      if (list.length > 0) return;
      drag = null;

      if (wasDrag && wasDrag.moved < 8) {
        var now = performance.now();
        if (now - lastTap < 300) {
          zoomAround(1.7, e.clientX, e.clientY);
          requestPaint(true);
        }
        lastTap = now;
        return;
      }

      // Inercia: al soltar, el planeta sigue girando y se frena solo.
      var speed = Math.hypot(velocity.x, velocity.y);
      if (speed > 0.08 && !reducedMotion()) {
        spin = { x: velocity.x * 16, y: velocity.y * 16 };
      }
      idleSince = Date.now();
    }

    globe.addEventListener('pointerup', endPointer, { passive: true });
    globe.addEventListener('pointercancel', endPointer, { passive: true });

    globe.addEventListener(
      'wheel',
      function (e) {
        e.preventDefault();
        followSelection = false;
        zoomAround(Math.exp(-e.deltaY * 0.0022), e.clientX, e.clientY);
        requestPaint(true);
        idleSince = Date.now();
      },
      { passive: false },
    );

    function zoomAround(factor, px, py) {
      var anchor = projection.invert ? projection.invert([px, py]) : null;
      cam.zoom *= factor;
      applyCam();
      if (anchor && isFinite(anchor[0]) && isFinite(anchor[1])) pinGeoTo(anchor, px, py);
    }

    function reducedMotion() {
      return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    }

    /* -------------------------------------------------------- vuelo a punto */

    var flight = null;

    function flyTo(lon, lat, zoom, ms) {
      if (reducedMotion()) {
        cam.lon = lon;
        cam.lat = lat;
        cam.zoom = zoom;
        applyCam();
        requestPaint(true);
        return;
      }
      var from = [cam.lon, cam.lat, cam.zoom];
      var interpolate = d3.geoInterpolate([cam.lon, cam.lat], [lon, lat]);
      flight = {
        from: from,
        interpolate: interpolate,
        zoom: zoom,
        start: performance.now(),
        ms: ms,
      };
      spin = null;
    }

    function ease(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    /* ------------------------------------------------------------- tamaños */

    function resize() {
      view.w = window.innerWidth;
      view.h = window.innerHeight;
      view.dpr = Math.min(2, window.devicePixelRatio || 1);

      [globe, starsCanvas, earthCanvas, world].forEach(function (c) {
        c.width = Math.round(view.w * view.dpr);
        c.height = Math.round(view.h * view.dpr);
        if (c !== world) {
          c.style.width = view.w + 'px';
          c.style.height = view.h + 'px';
        }
      });

      // El globo ocupa el ancho en móvil y deja sitio a la columna de datos en
      // pantallas anchas, donde el texto vive a la izquierda.
      var wide = view.w >= 900;
      focus.x = wide ? view.w * 0.66 : view.w / 2;
      focus.y = wide ? view.h * 0.5 : view.h * 0.55;
      // El planeta se sale por los lados y por abajo, pero el borde de arriba se
      // ve: es lo que hace que se lea como un planeta y no como un mapa redondo.
      baseScale = wide
        ? Math.min(view.w * 0.32, view.h * 0.44)
        : Math.min(view.w * 0.66, view.h * 0.4);

      applyCam();
      paintStars();
      worldKey = '';
      requestPaint(true);
    }

    /* ---------------------------------------------------------- chapas DOM */

    var chipLayer = document.getElementById('chips');
    var chipPool = [];

    function chip(index) {
      if (chipPool[index] === undefined) {
        var node = document.createElement('button');
        node.type = 'button';
        node.className = 'chip';
        node.innerHTML =
          '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><span></span>';
        chipLayer.appendChild(node);
        chipPool[index] = node;
      }
      return chipPool[index];
    }

    function paintChips(selected) {
      var wanted = [];
      if (selected) {
        wanted.push({ code: selected.origin, kind: 'is-origin' });
        wanted.push({ code: selected.destination, kind: 'is-target' });
      }

      wanted.forEach(function (item, index) {
        var node = chip(index);
        var a = byIata[item.code];
        if (!a || !visible(a.lon, a.lat)) {
          node.style.opacity = '0';
          node.style.pointerEvents = 'none';
          return;
        }
        var p = projection([a.lon, a.lat]);
        if (!p) {
          node.style.opacity = '0';
          return;
        }
        node.className = 'chip ' + item.kind;
        node.style.opacity = '1';
        node.style.pointerEvents = 'auto';
        node.style.transform =
          'translate(-50%,-50%) translate(' +
          p[0].toFixed(1) +
          'px,' +
          (p[1] - 26).toFixed(1) +
          'px)';
        node.querySelector('span').textContent = item.code;
        node.setAttribute('aria-label', a.name);
      });

      for (var i = wanted.length; i < chipPool.length; i++) {
        chipPool[i].style.opacity = '0';
        chipPool[i].style.pointerEvents = 'none';
      }
    }

    /* ------------------------------------------------------- texto y listas */

    var elGreeting = document.getElementById('greeting');
    var elCity = document.getElementById('dest-city');
    var elSubline = document.getElementById('subline');
    var elAirborne = document.getElementById('airborne');
    var elLeft = document.getElementById('scrub-left');
    var elMid = document.getElementById('scrub-mid');
    var elRight = document.getElementById('scrub-right');
    var elTicks = document.getElementById('ticks');
    var elCursor = document.getElementById('cursor');
    var elRail = document.getElementById('rail');

    var TICKS = 37;
    for (var t = 0; t < TICKS; t++) {
      var mark = document.createElement('i');
      if (t % 6 === 0) mark.className = 'tall';
      elTicks.appendChild(mark);
    }
    var tickNodes = Array.prototype.slice.call(elTicks.children);

    function greetingFor(now) {
      var h = new Date(now).getHours();
      if (h < 6) return 'Buenas noches';
      if (h < 13) return 'Buenos días';
      if (h < 21) return 'Buenas tardes';
      return 'Buenas noches';
    }

    function tag(text, amber) {
      var span = document.createElement('span');
      span.className = amber ? 'tag amber' : 'tag';
      span.textContent = text;
      return span;
    }

    function paintHero(now, selected, state) {
      elGreeting.textContent = greetingFor(now);

      if (!selected) {
        elCity.textContent = 'Mundo en calma';
        elSubline.textContent = '';
        elSubline.appendChild(tag('Ningún vuelo programado'));
        return;
      }

      elCity.textContent = cityOf(selected.destination);
      elSubline.textContent = '';
      elSubline.appendChild(tag(selected.callsign, true));
      elSubline.appendChild(tag(selected.origin + ' → ' + selected.destination));
      elSubline.appendChild(
        tag(state.airborne ? selected.airline : 'Sale a las ' + hhmm(state.dep) + ' UTC'),
      );
    }

    function paintScrub(now, selected, state) {
      if (!selected) {
        elLeft.textContent = '—';
        elMid.textContent = 'Sin actividad';
        elRight.textContent = '—';
        elCursor.style.left = '0%';
        tickNodes.forEach(function (n) {
          n.classList.remove('done');
        });
        return;
      }

      elLeft.textContent = hhmm(state.dep) + ' ' + selected.origin;
      elRight.textContent = selected.destination + ' ' + hhmm(state.arr);
      elMid.textContent = state.airborne
        ? duration(state.arr - now) + ' restantes'
        : 'Despega en ' + duration(state.dep - now);

      var progress = state.airborne ? state.t : 0;
      elCursor.style.left = (progress * 100).toFixed(2) + '%';
      tickNodes.forEach(function (n, index) {
        n.classList.toggle('done', index / (TICKS - 1) <= progress);
      });
    }

    var selectedCard = null;

    /** Deja a la vista la tarjeta del vuelo elegido, venga de donde venga la elección. */
    function revealSelected() {
      if (!selectedCard || !selectedCard.scrollIntoView) return;
      selectedCard.scrollIntoView({
        behavior: reducedMotion() ? 'auto' : 'smooth',
        inline: 'center',
        block: 'nearest',
      });
    }

    function paintRail(now, items) {
      elRail.textContent = '';
      selectedCard = null;

      items.forEach(function (item) {
        var f = item.flight;
        var card = document.createElement('button');
        card.type = 'button';
        card.className = 'card' + (f.id === selectedId ? ' on' : '');
        card.setAttribute('role', 'option');
        card.setAttribute('aria-selected', f.id === selectedId ? 'true' : 'false');

        var top = document.createElement('div');
        top.className = 'card-top mono';
        var left = document.createElement('span');
        left.textContent = f.origin + ' → ' + f.destination;
        var right = document.createElement('span');
        right.textContent = item.state.airborne
          ? duration(item.state.arr - now) + ' rest.'
          : hhmm(item.state.dep);
        top.appendChild(left);
        top.appendChild(right);

        var city = document.createElement('div');
        city.className = 'card-city';
        city.textContent = cityOf(f.destination);

        var sub = document.createElement('div');
        sub.className = 'card-sub';
        sub.textContent = f.airline + ' · ' + f.aircraft;

        var bar = document.createElement('div');
        bar.className = 'bar';
        var fill = document.createElement('span');
        fill.style.width = Math.round((f.pax / Math.max(1, f.seats)) * 100) + '%';
        bar.appendChild(fill);

        card.appendChild(top);
        card.appendChild(city);
        card.appendChild(sub);
        card.appendChild(bar);
        card.addEventListener('click', function () {
          select(f.id, true);
        });

        if (f.id === selectedId) selectedCard = card;
        elRail.appendChild(card);
      });
    }

    function select(id, recentre) {
      selectedId = id;
      var f = findFlight(id);
      paintRail(Date.now(), listed);
      revealSelected();
      if (f && recentre) {
        followSelection = true;
        var mid = slerp(f, 0.5);
        flyTo(mid[0], mid[1], Math.max(cam.zoom, 2.1), 900);
      }
      renderSheet();
      requestPaint(true);
    }

    /* ------------------------------------------------- centro de operaciones */

    var sheet = document.getElementById('sheet');
    var veil = document.getElementById('veil');
    var sheetBody = document.getElementById('sheet-body');
    var tabButtons = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    var activeTab = 'world';

    function node(tag, className, text) {
      var n = document.createElement(tag);
      if (className) n.className = className;
      if (text !== undefined) n.textContent = text;
      return n;
    }

    function kpi(label, value, unit) {
      var box = node('div', 'kpi');
      box.appendChild(node('dt', null, label));
      var dd = node('dd', null, value);
      if (unit) {
        var small = node('small', null, ' ' + unit);
        dd.appendChild(small);
      }
      box.appendChild(dd);
      return box;
    }

    function worldTab() {
      var frag = document.createDocumentFragment();
      var grid = node('dl', 'kpis');
      var t = DATA.totals;

      grid.appendChild(kpi('Vuelos del día', thousands(t.flights)));
      grid.appendChild(kpi('Aterrizados', thousands(t.landed)));
      grid.appendChild(kpi('Pasajeros', thousands(t.pax)));
      grid.appendChild(
        kpi('Ocupación media', (t.loadFactor * 100).toFixed(1).replace('.', ',') + ' %'),
      );
      grid.appendChild(kpi('Puntualidad', t.onTimePercent.toFixed(1).replace('.', ',') + ' %'));
      grid.appendChild(kpi('Cancelados', thousands(t.cancelled)));
      grid.appendChild(kpi('Aerolíneas', thousands(DATA.airlines.length)));
      grid.appendChild(kpi('Aeropuertos', thousands(DATA.airports.length)));
      grid.appendChild(kpi('Rutas activas', thousands(DATA.routes.length)));
      grid.appendChild(
        kpi('Queroseno', DATA.world.fuelPriceEurPerKg.toFixed(2).replace('.', ',') + ' €', '/kg'),
      );
      frag.appendChild(grid);

      // Honestidad antes que escaparate: estos números salen de una simulación
      // real, pero la economía todavía no está calibrada y decirlo forma parte
      // del producto.
      var note = node('p', 'note');
      note.appendChild(node('b', null, 'Economía sin calibrar. '));
      note.appendChild(
        document.createTextNode(
          'Estas cifras salen de la simulación real, no de datos inventados, pero el peso de ' +
            'mercado de cada aeropuerto todavía se deriva de su tamaño y sus pistas, no del ' +
            'tráfico de pasajeros publicado. Por eso la ocupación sale alta y casi ninguna ' +
            'aerolínea pierde dinero, cuando el diseño pide que entre el 10 % y el 20 % pierda. ' +
            'Es el pendiente C-1 de docs/decisions.md.',
        ),
      );
      frag.appendChild(note);
      return frag;
    }

    function airlinesTab() {
      var wrap = node('div', 'scroller');
      var table = node('table');
      var head = node('thead');
      var hr = node('tr');
      ['Aerolínea', 'Flota', 'Rutas', 'Ocup.', 'Punt.', 'Resultado'].forEach(function (label) {
        hr.appendChild(node('th', null, label));
      });
      head.appendChild(hr);
      table.appendChild(head);

      var body = node('tbody');
      DATA.airlines.slice(0, 40).forEach(function (a) {
        var tr = node('tr');
        var who = node('td', 'who', a.name);
        who.appendChild(node('span', null, a.hub + ' · ' + a.strategy));
        tr.appendChild(who);
        tr.appendChild(node('td', 'mono', String(a.aircraft)));
        tr.appendChild(node('td', 'mono', String(a.routes)));
        tr.appendChild(node('td', 'mono', a.loadFactor.toFixed(0) + ' %'));
        tr.appendChild(node('td', 'mono', a.onTime.toFixed(0) + ' %'));
        tr.appendChild(
          node('td', 'mono ' + (a.resultEur >= 0 ? 'pos' : 'neg'), euros(a.resultEur)),
        );
        body.appendChild(tr);
      });
      table.appendChild(body);
      wrap.appendChild(table);
      return wrap;
    }

    function row(label, value) {
      var div = node('div');
      div.appendChild(node('dt', null, label));
      div.appendChild(node('dd', 'mono', value));
      return div;
    }

    function flightTab() {
      var f = findFlight(selectedId);
      if (!f) return node('p', 'note', 'No hay ningún vuelo seleccionado.');

      var state = schedule(f, Date.now());
      var list = node('dl', 'ledger');
      list.appendChild(row('Vuelo', f.callsign));
      list.appendChild(row('Operador', f.airline));
      list.appendChild(row('Equipo', f.aircraft));
      list.appendChild(row('Origen', byIata[f.origin] ? byIata[f.origin].name : f.origin));
      list.appendChild(
        row('Destino', byIata[f.destination] ? byIata[f.destination].name : f.destination),
      );
      list.appendChild(row('Distancia', thousands(f.distanceKm) + ' km'));
      list.appendChild(row('Salida', hhmm(state.dep) + ' UTC'));
      list.appendChild(row('Llegada', hhmm(state.arr) + ' UTC'));
      list.appendChild(row('Tiempo de vuelo', duration(state.span)));
      list.appendChild(row('Pasaje', thousands(f.pax) + ' / ' + thousands(f.seats)));
      list.appendChild(row('Ocupación', Math.round((f.pax / Math.max(1, f.seats)) * 100) + ' %'));

      var frag = document.createDocumentFragment();
      frag.appendChild(list);

      var carrier = airlineByName[f.airline];
      if (carrier) {
        var more = node('dl', 'ledger');
        more.style.marginTop = '12px';
        more.appendChild(row('Base', carrier.hub));
        more.appendChild(row('Estrategia', carrier.strategy));
        more.appendChild(row('Flota', String(carrier.aircraft) + ' aviones'));
        more.appendChild(row('Rutas activas', String(carrier.routes)));
        more.appendChild(row('Caja', euros(carrier.cashEur)));
        more.appendChild(row('Resultado del día', euros(carrier.resultEur)));
        frag.appendChild(more);
      }

      return frag;
    }

    function renderSheet() {
      if (!sheet.classList.contains('open')) return;
      sheetBody.textContent = '';
      sheetBody.appendChild(
        activeTab === 'world' ? worldTab() : activeTab === 'airlines' ? airlinesTab() : flightTab(),
      );
    }

    function openSheet(open) {
      sheet.classList.toggle('open', open);
      veil.classList.toggle('on', open);
      sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
      if (open) renderSheet();
    }

    tabButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        activeTab = button.getAttribute('data-tab');
        tabButtons.forEach(function (other) {
          other.setAttribute('aria-selected', other === button ? 'true' : 'false');
        });
        renderSheet();
        sheetBody.scrollTop = 0;
      });
    });

    document.getElementById('cta').addEventListener('click', function () {
      openSheet(true);
    });
    document.getElementById('open-ops').addEventListener('click', function () {
      openSheet(true);
    });
    document.getElementById('close-ops').addEventListener('click', function () {
      openSheet(false);
    });
    veil.addEventListener('click', function () {
      openSheet(false);
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') openSheet(false);
    });

    // Arrastrar el asa hacia abajo cierra el panel, como en cualquier hoja de móvil.
    var grip = document.getElementById('grip');
    var gripStart = null;
    grip.addEventListener('pointerdown', function (e) {
      gripStart = e.clientY;
      try {
        grip.setPointerCapture(e.pointerId);
      } catch (ignored) {
        /* sin captura */
      }
    });
    grip.addEventListener('pointermove', function (e) {
      if (gripStart === null) return;
      var dy = Math.max(0, e.clientY - gripStart);
      sheet.style.transform = 'translateY(' + dy + 'px)';
    });
    function gripEnd(e) {
      if (gripStart === null) return;
      var dy = Math.max(0, e.clientY - gripStart);
      gripStart = null;
      sheet.style.transform = '';
      if (dy > 90) openSheet(false);
    }
    grip.addEventListener('pointerup', gripEnd);
    grip.addEventListener('pointercancel', gripEnd);

    document.getElementById('recenter').addEventListener('click', function () {
      var f = findFlight(selectedId);
      if (!f) {
        flyTo(6, 46, 1, 800);
        return;
      }
      followSelection = true;
      var mid = slerp(f, 0.5);
      flyTo(mid[0], mid[1], 2.4, 800);
    });

    document.getElementById('shuffle').addEventListener('click', function () {
      if (listed.length === 0) return;
      var index = 0;
      for (var i = 0; i < listed.length; i++) {
        if (listed[i].flight.id === selectedId) index = i;
      }
      select(listed[(index + 1) % listed.length].flight.id, true);
    });

    /* --------------------------------------------------------------- bucle */

    var needsPaint = true;
    var lastChrome = 0;

    function requestPaint(force) {
      needsPaint = true;
      if (force) worldKey = worldKey === '' ? '' : worldKey;
    }

    function tick() {
      var now = Date.now();
      var frameStart = performance.now();

      // Animación de acercamiento a un vuelo.
      if (flight) {
        var progress = Math.min(1, (frameStart - flight.start) / flight.ms);
        var point = flight.interpolate(ease(progress));
        cam.lon = point[0];
        cam.lat = point[1];
        cam.zoom = flight.from[2] + (flight.zoom - flight.from[2]) * ease(progress);
        applyCam();
        if (progress >= 1) flight = null;
        needsPaint = true;
      } else if (spin) {
        dragBy(spin.x, spin.y);
        spin.x *= 0.93;
        spin.y *= 0.93;
        if (Math.abs(spin.x) < 0.05 && Math.abs(spin.y) < 0.05) spin = null;
        needsPaint = true;
      }

      var flying = flightsNow(now);
      elAirborne.textContent = String(flying.length);

      var nextList = railItems(flying, now);
      var selected = findFlight(selectedId);
      var stillListed = nextList.some(function (item) {
        return item.flight.id === selectedId;
      });

      // Cuando el vuelo elegido aterriza, el globo no se queda huérfano: pasa al
      // siguiente sin que nadie tenga que tocar nada.
      if (!selected || !stillListed) {
        var pick = pickDefault(nextList);
        if (pick) {
          selectedId = pick;
          selected = findFlight(pick);
          if (followSelection && selected) {
            var mid = slerp(selected, 0.5);
            flyTo(mid[0], mid[1], Math.max(cam.zoom, 2.1), 900);
          }
          renderSheet();
        }
      }

      var listChanged = nextList.length !== listed.length;
      if (!listChanged) {
        for (var i = 0; i < nextList.length; i++) {
          if (nextList[i].flight.id !== listed[i].flight.id) {
            listChanged = true;
            break;
          }
        }
      }
      listed = nextList;

      if (listChanged || now - lastChrome > 20000) {
        paintRail(now, listed);
        lastChrome = now;
      }

      var state = selected ? schedule(selected, now) : null;
      paintHero(now, selected, state);
      paintScrub(now, selected, state);

      // El terminador entra en la clave: cuando el Sol se mueve lo bastante
      // como para que se note, la capa estática se repinta sola. Un minuto de
      // mundo son quince centésimas de grado de longitud subsolar.
      var sun = sunDirection(now);
      var key = [
        Math.round(cam.lon * 20),
        Math.round(cam.lat * 20),
        Math.round(cam.zoom * 60),
        view.w,
        view.h,
        Math.round(now / 60000),
      ].join('|');

      if (key !== worldKey) {
        worldKey = key;
        paintEarth(sun);
        paintWorld(sun);
        needsPaint = true;
      }

      paintLive(now, flying, selected);
      paintChips(selected);
      needsPaint = false;

      requestAnimationFrame(tick);
    }

    /**
     * Lo que entra en el carrusel.
     *
     * A media mañana hay más de cien aviones en el aire a la vez y rehacer cien
     * tarjetas cada vez que uno despega es trabajo tirado: el dedo no llega ni
     * a la décima. Se enseña una ventana, con el vuelo elegido dentro aunque
     * haya quedado fuera del corte.
     */
    function railItems(flying, now) {
      var source = flying.length > 0 ? flying : upcoming(now);
      var shown = source.slice(0, RAIL_SIZE);
      var present = shown.some(function (item) {
        return item.flight.id === selectedId;
      });
      if (present || selectedId === null) return shown;

      for (var i = RAIL_SIZE; i < source.length; i++) {
        if (source[i].flight.id === selectedId) return [source[i]].concat(shown);
      }
      return shown;
    }

    /** El vuelo más largo en el aire: el arco más vistoso y el que mejor lee. */
    function pickDefault(items) {
      var best = null;
      items.forEach(function (item) {
        if (!best || item.flight.distanceKm > best.flight.distanceKm) best = item;
      });
      return best ? best.flight.id : null;
    }

    /* --------------------------------------------------------------- arranque */

    window.addEventListener('resize', resize);
    if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

    earth = initEarth();
    resize();

    var initial = railItems(flightsNow(Date.now()), Date.now());
    listed = initial;
    selectedId = pickDefault(initial);
    paintRail(Date.now(), listed);
    revealSelected();

    var start = findFlight(selectedId);
    if (start) {
      var midpoint = slerp(start, 0.5);
      cam.lon = midpoint[0];
      cam.lat = midpoint[1];
      cam.zoom = 1.15;
      applyCam();
    }

    requestAnimationFrame(tick);
  })();
</script>

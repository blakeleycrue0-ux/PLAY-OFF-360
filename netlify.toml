# Despliegue de la consola de operaciones.
#
# El sitio es una única página estática que se construye a partir de la
# plantilla y de la instantánea de datos versionada. No necesita base de datos
# en tiempo de construcción: generar la instantánea exige un mundo simulado, y
# eso se hace en desarrollo con `pnpm ui:build`.

[build]
  command = "node scripts/build-preview.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # La construcción no necesita ninguna dependencia: es un script de Node sin
  # importaciones externas. Aun así se deja preparado por si algún día hiciera
  # falta instalar, para que no se descargue un navegador entero.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"
  NPM_FLAGS = "--production=false"

# Una sola página: cualquier ruta la sirve, en vez de devolver un 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

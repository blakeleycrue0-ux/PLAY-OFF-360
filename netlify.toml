# El sitio de Netlify se creó cuando el repositorio estaba vacío, así que sus
# ajustes de la interfaz publicaban la raíz del repo (sin index.html → 404).
# Esta configuración manda sobre los ajustes de la interfaz.

[build]
  command = "npm run build"
  publish = "out"


# La clave anon es pública (va en el bundle del navegador en cualquier app de
